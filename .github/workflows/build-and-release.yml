name: Build and Release Web Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web playable
        run: |
          # Replace this with your real build command that outputs to build_web/
          # Example: npm run build
          if [ -d build_web ]; then
            echo "build_web already exists"
          else
            mkdir -p build_web
            echo "<!-- placeholder build -->" > build_web/index.html
          fi

      - name: Show build output
        run: |
          echo "=== build_web contents ==="
          ls -la build_web || true

      - name: Archive build_web
        run: |
          if [ -d build_web ]; then
            tar -czf build_web.tar.gz -C build_web .
            ls -lh build_web.tar.gz
          else
            echo "No build_web directory found; skipping archive"
            exit 1
          fi

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "engine-build-${{ github.run_id }}"
          name: "Engine build ${{ github.run_number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: build_web.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug list repo root
        run: ls -la
